name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Package CLI
        run: mvn -B -DskipTests -pl engine-cli -am package
      - uses: actions/upload-artifact@v4
        with:
          name: chronodim-cli
          path: engine-cli/target/chronodim.jar
